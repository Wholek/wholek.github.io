<script>
// Kliknięcie w "Research" w belce przenosi na stronę Overview.
// Rozwijana lista nadal otwiera się samym najechaniem.
document.addEventListener('DOMContentLoaded', function () {
  // Klucz strony: nazwa pliku bez .html ("/" i "/index.html" to "index").
  function pageKey(path) {
    var name = path.split('/').filter(Boolean).pop() || 'index';
    return name.replace(/\.html$/, '');
  }
  var current = pageKey(window.location.pathname);

  document.querySelectorAll('.navbar .nav-item.dropdown > .dropdown-toggle')
    .forEach(function (toggle) {
      // Quarto zaznacza tylko pozycję w rozwijanym menu, nie sam napis w
      // belce - tu podświetlamy też "Research", gdy jesteśmy na dowolnej
      // z jego podstron.
      var menu = toggle.parentElement.querySelector('.dropdown-menu');
      if (menu) {
        var onSubpage = Array.prototype.some.call(
          menu.querySelectorAll('a.dropdown-item'),
          function (a) { return pageKey(new URL(a.href, window.location.href).pathname) === current; });
        if (onSubpage) toggle.classList.add('active');
      }

      if (toggle.textContent.trim().toLowerCase() !== 'research') return;
      toggle.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        window.location.href = 'research.html';
      });
    });
});

// Telefon: pasek zakładek podstron Research w miejscu małej strzałki.
// Zakładki powstają z bocznej listy; CSS pokazuje je tylko poniżej 992 px.
document.addEventListener('DOMContentLoaded', function () {
  var links = document.querySelectorAll('#quarto-sidebar a.sidebar-link');
  var bar = document.querySelector('.quarto-secondary-nav > .container-fluid');
  if (!links.length || !bar) return;
  var tabs = document.createElement('div');
  tabs.className = 'kg-tabs';
  tabs.setAttribute('role', 'navigation');
  tabs.setAttribute('aria-label', 'Research');
  links.forEach(function (a) {
    var t = document.createElement('a');
    t.href = a.getAttribute('href');
    t.textContent = a.textContent.trim();
    if (a.classList.contains('active')) {
      t.className = 'active';
      t.setAttribute('aria-current', 'page');
    }
    tabs.appendChild(t);
  });
  bar.appendChild(tabs);
  var cur = tabs.querySelector('a.active');
  if (cur) tabs.scrollLeft = Math.max(0, cur.offsetLeft - 16);
});
</script>
